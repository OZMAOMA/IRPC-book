<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRPC BOOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b3c5d;
    --navy-deep:#082a41;
    --sky:#328cc1;
    --sky-light:#e7f2fa;
    --sky-pale:#f2f8fc;
    --red:#D2042D;
    --paper:#f9f8f4;
    --ink:#16242e;
    --ink-soft:#5b6c76;
    --line: rgba(11,60,93,0.13);
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ font-family:'Sarabun', sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; }
  h1,h2,h3,.display{font-family:'Kanit', sans-serif;}
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--sky); color:#fff;}
  .banner{ background:#fff7e0; color:#7a5b00; border-bottom:1px solid #f0d98c; padding:9px 20px; font-size:12.5px; text-align:center; }

  /* ---------- AUTH SCREEN ---------- */
  .auth-wrap{
    flex:1; display:flex; align-items:stretch; justify-content:center; min-height:100vh;
    background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 42px;
  }
  .auth-grid{
    display:grid; grid-template-columns: 1.1fr 1fr; width:100%; max-width:1080px; margin:auto;
    box-shadow: 0 30px 60px rgba(8,42,65,0.18); border-radius: 20px; overflow:hidden; min-height: 660px;
  }
  .auth-hero{
    background: linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, var(--sky) 130%);
    color:#fff; padding:56px 48px; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between;
  }
  .auth-hero::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 40px); pointer-events:none;
  }
  .spine{
    position:absolute; right:-2px; top:0; bottom:0; width:26px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.16) 0 8px, rgba(255,255,255,0.02) 8px 16px);
    box-shadow: -8px 0 22px rgba(0,0,0,0.25) inset;
  }
  .brand-mark{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
  .brand-mark .book-icon{
    width:42px; height:42px; border-radius:9px; background: var(--red); display:flex; align-items:center; justify-content:center;
    font-family:'Kanit'; font-weight:800; font-size:19px; color:#fff; box-shadow: 0 6px 14px rgba(210,4,45,0.45); flex-shrink:0;
  }
  .brand-mark .word{font-size:22px; font-weight:700; letter-spacing:0.5px;}
  .brand-mark .word b{color:#ffd9df;}
  .hero-copy{position:relative; z-index:1; margin-top:40px;}
  .hero-copy h1{font-size:32px; line-height:1.28; font-weight:600; max-width:380px;}
  .hero-copy p{margin-top:16px; color:rgba(255,255,255,0.78); max-width:360px; line-height:1.7; font-size:15px;}
  .hero-tags{position:relative; z-index:1; display:flex; gap:10px; flex-wrap:wrap; margin-top:32px;}
  .hero-tag{ font-size:13px; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); }
  .hero-foot{position:relative; z-index:1; font-size:12.5px; color:rgba(255,255,255,0.55);}

  .auth-panel{ background:#fff; padding:44px 48px; display:flex; flex-direction:column; overflow-y:auto; }
  .tabs{display:flex; gap:4px; background:var(--sky-pale); padding:4px; border-radius:11px; margin-bottom:26px;}
  .tab-btn{ flex:1; border:none; background:transparent; padding:11px 0; font-size:15px; font-weight:600; color:var(--ink-soft); border-radius:8px; transition: all .18s ease; }
  .tab-btn.active{background:var(--navy); color:#fff; box-shadow:0 6px 14px rgba(11,60,93,0.25);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13.5px; font-weight:600; color:var(--navy); margin-bottom:6px;}
  .field .sub{font-weight:400; color:var(--ink-soft); font-size:11.5px;}
  .field input, .field select{
    width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Sarabun'; font-size:15px; background:var(--sky-pale); transition: border-color .15s ease, background .15s ease;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--sky); background:#fff;}

  .role-pick{display:flex; gap:10px; margin-bottom:18px;}
  .role-opt{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px 10px; text-align:center;
    font-size:14px; font-weight:600; color:var(--ink-soft); background:var(--sky-pale); transition: all .15s ease;
  }
  .role-opt small{display:block; font-weight:400; font-size:11.5px; margin-top:2px; color:var(--ink-soft);}
  .role-opt.selected{border-color:var(--sky); background:var(--sky-light); color:var(--navy);}
  .role-opt.selected.teacher{border-color:var(--red); background:#fdeaee; color:var(--red);}

  .submit-btn{
    width:100%; padding:14px; border:none; border-radius:10px; background:var(--sky); color:#fff;
    font-size:15.5px; font-weight:700; letter-spacing:0.2px; margin-top:4px; transition: background .15s ease, transform .1s ease;
  }
  .submit-btn:hover{background:var(--navy);}
  .submit-btn:active{transform:scale(0.99);}
  .submit-btn:disabled{opacity:0.55; cursor:not-allowed;}
  .switch-line{margin-top:18px; text-align:center; font-size:13.5px; color:var(--ink-soft);}
  .switch-line b{color:var(--sky); cursor:pointer;}
  .error-msg{ background:#fdeaee; color:var(--red); border:1px solid rgba(210,4,45,0.25); padding:10px 13px; border-radius:9px; font-size:13.5px; margin-bottom:14px; }
  .ok-msg{ background:#e9f8ee; color:#1a7a3c; border:1px solid rgba(26,122,60,0.25); padding:10px 13px; border-radius:9px; font-size:13.5px; margin-bottom:14px; }
  .hint-msg{ background:var(--sky-light); color:var(--navy); border:1px solid rgba(50,140,193,0.25); padding:9px 13px; border-radius:9px; font-size:12.5px; margin-bottom:14px; line-height:1.5; }

  /* ---------- APP SHELL (dashboard layout) ---------- */
  .shell{display:flex; min-height:100vh; flex:1;}
  .sidebar{
    width:236px; flex-shrink:0; background:var(--navy); color:#fff; padding:26px 18px;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar .brand-mark{margin-bottom:30px; padding:0 6px;}
  .sidebar .brand-mark .word{font-size:18px;}
  .sidebar .brand-mark .book-icon{width:32px; height:32px; font-size:13px;}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px;
    font-size:14px; font-weight:600; color:rgba(255,255,255,0.75); margin-bottom:6px; border:1px solid transparent;
  }
  .nav-item .dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.35); flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(255,255,255,0.12); color:#fff; border-color:rgba(255,255,255,0.15);}
  .nav-item.active .dot{background:var(--sky);}
  .sidebar-spacer{flex:1;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,0.12); padding-top:14px;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .main-header{
    display:flex; align-items:center; justify-content:space-between; padding:22px 40px;
    background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:15; flex-wrap:wrap; gap:12px;
  }
  .page-title{font-size:20px; font-weight:600; color:var(--navy);}
  .user-chip{display:flex; align-items:center; gap:10px;}
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--sky); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; font-family:'Kanit'; flex-shrink:0; color:#fff;
  }
  .user-meta{line-height:1.25;}
  .user-meta .name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .user-meta .role{font-size:11.5px; color:var(--ink-soft);}
  .logout-btn{
    background:#fff; border:1.5px solid var(--line); color:var(--ink); padding:8px 14px; border-radius:8px; font-size:13px; margin-left:10px;
  }
  .logout-btn:hover{border-color:var(--red); color:var(--red);}

  .main-body{padding:30px 40px 80px; max-width:760px; margin:0 auto; width:100%;}

  .filter-chip{
    display:inline-flex; align-items:center; gap:8px; background:var(--sky-light); color:var(--navy);
    padding:7px 12px; border-radius:999px; font-size:12.5px; margin-bottom:16px; font-weight:600;
  }
  .filter-chip button{background:none; border:none; color:var(--navy); font-weight:700; font-size:13px;}

  .composer{ background:#fff; border-radius:var(--radius); border:1px solid var(--line); padding:18px 20px; margin-bottom:26px; box-shadow:0 8px 22px rgba(11,60,93,0.06); }
  .composer select{
    border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; background:var(--sky-pale);
    font-family:'Sarabun'; margin-bottom:12px; min-width:160px;
  }
  .composer textarea{
    width:100%; min-height:70px; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; resize:vertical;
    font-family:'Sarabun'; font-size:15px; outline:none; background:var(--sky-pale); line-height:1.6; margin-bottom:12px;
  }
  .composer textarea:focus{border-color:var(--sky); background:#fff;}
  .composer-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .urgent-check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); user-select:none;}
  .urgent-check input{width:16px; height:16px; accent-color:var(--red);}
  .post-btn{ background:var(--navy); color:#fff; border:none; padding:9px 22px; border-radius:8px; font-size:13.5px; font-weight:600; }
  .post-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .post-btn:hover:not(:disabled){background:var(--sky);}

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .display{font-size:20px; color:var(--navy); margin-bottom:8px;}

  .post-card{
    background:#fff; border-radius:var(--radius); border:1px solid var(--line); padding:18px 22px 18px 26px;
    margin-bottom:16px; position:relative; box-shadow:0 8px 22px rgba(11,60,93,0.06);
  }
  .post-card::before{
    content:""; position:absolute; left:0; top:12px; bottom:12px; width:2px;
    background: repeating-linear-gradient(to bottom, var(--sky) 0 6px, transparent 6px 13px);
    border-radius:2px;
  }
  .post-head{display:flex; align-items:flex-start; gap:11px; margin-bottom:10px;}
  .post-head .meta{line-height:1.35;}
  .post-head .pname{font-weight:600; font-size:14.5px;}
  .post-head .pname .prole-inline{font-weight:400; color:var(--ink-soft); font-size:12px;}
  .post-head .ptime{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .tag-row{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .tag{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .tag.urgent{background:#fdeaee; color:var(--red);}
  .tag.subject{background:var(--sky-light); color:var(--navy);}
  .save-btn{ background:none; border:none; font-size:16px; color:var(--ink-soft); line-height:1; padding:2px; }
  .save-btn.saved{color:#e0a300;}
  .post-body{font-size:15px; line-height:1.75; white-space:pre-wrap; color:var(--ink);}

  .comments{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .comment-item{display:flex; gap:9px; padding:6px 0; font-size:13.5px; align-items:flex-start;}
  .comment-item .avatar{width:26px; height:26px; font-size:11px;}
  .comment-item .c-body{background:var(--sky-pale); border-radius:10px; padding:7px 12px; flex:1;}
  .comment-item .c-name{font-weight:600; font-size:12.5px; margin-right:6px;}
  .comment-form{display:flex; gap:8px; margin-top:10px;}
  .comment-form input{ flex:1; border:1.5px solid var(--line); border-radius:20px; padding:8px 14px; font-family:'Sarabun'; font-size:13.5px; background:var(--sky-pale); }
  .comment-form input:focus{outline:none; border-color:var(--sky); background:#fff;}
  .comment-form button{ background:var(--sky); color:#fff; border:none; padding:0 16px; border-radius:20px; font-size:13px; font-weight:600; }
  .toggle-comments{ font-size:12.5px; color:var(--sky); font-weight:600; margin-top:10px; display:inline-block; cursor:pointer; }
  .load-msg{text-align:center; padding:40px; color:var(--ink-soft); font-size:14px;}

  /* subjects page */
  .subj-panel{ background:#fff; border-radius:var(--radius); border:1px solid var(--line); padding:20px 22px; margin-bottom:22px; box-shadow:0 8px 22px rgba(11,60,93,0.06); }
  .subj-panel h3{font-size:15px; color:var(--navy); margin-bottom:14px;}
  .subj-form{display:flex; gap:10px; flex-wrap:wrap;}
  .subj-form input{ flex:1; min-width:160px; padding:11px 13px; border-radius:9px; border:1.5px solid var(--line); font-family:'Sarabun'; font-size:14px; background:var(--sky-pale); }
  .subj-form input:focus{outline:none; border-color:var(--sky); background:#fff;}
  .subj-form button{ background:var(--navy); color:#fff; border:none; padding:0 18px; border-radius:9px; font-size:13.5px; font-weight:600; }
  .subj-form button:hover{background:var(--sky);}
  .subj-list{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));}
  .subj-card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 6px 16px rgba(11,60,93,0.05); }
  .subj-card .sname{font-weight:600; font-size:15px; color:var(--navy); margin-bottom:4px;}
  .subj-card .steacher{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .subj-card .scode{ display:inline-block; font-family:monospace; font-size:13px; background:var(--sky-light); color:var(--navy); padding:3px 9px; border-radius:6px; letter-spacing:1px; margin-bottom:10px; }
  .subj-card .smembers{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .subj-card .sview{ background:var(--sky); color:#fff; border:none; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; width:100%; }
  .subj-card .sview:hover{background:var(--navy);}

  /* settings page */
  .settings-card{ background:#fff; border-radius:var(--radius); border:1px solid var(--line); padding:24px; box-shadow:0 8px 22px rgba(11,60,93,0.06); max-width:460px; }
  .settings-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .k{color:var(--ink-soft);}
  .settings-row .v{font-weight:600; color:var(--ink);}

  @media (max-width:820px){
    .auth-grid{grid-template-columns:1fr; min-height:auto;}
    .auth-hero{display:none;}
    .auth-panel{padding:38px 24px;}
    .auth-wrap{padding:0;}
    .auth-grid{border-radius:0; box-shadow:none;}
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:static; flex-direction:row; align-items:center; overflow-x:auto; padding:14px 16px;}
    .sidebar .brand-mark{margin-bottom:0; margin-right:10px;}
    .sidebar-spacer{display:none;}
    .sidebar-foot{border-top:none; padding-top:0;}
    .nav-item{margin-bottom:0; white-space:nowrap;}
    .main-header{padding:16px 20px;}
    .main-body{padding:20px 16px 60px;}
  }
</style>
</head>
<body>
<div id="app"><div class="load-msg">กำลังโหลด IRPC BOOK…</div></div>

<script>
(function(){

  /* ---------- storage layer with in-memory fallback ---------- */
  var memoryStore = { personal:{}, shared:{} };
  var storageOK = (typeof window.storage !== 'undefined' && window.storage);
  var storage = {
    get: async function(key, shared){
      if(storageOK){ try{ return await window.storage.get(key, shared); }catch(e){ return null; } }
      var bucket = shared ? memoryStore.shared : memoryStore.personal;
      return (key in bucket) ? { key:key, value:bucket[key], shared: !!shared } : null;
    },
    set: async function(key, value, shared){
      if(storageOK){ try{ return await window.storage.set(key, value, shared); }catch(e){ return null; } }
      var bucket = shared ? memoryStore.shared : memoryStore.personal;
      bucket[key] = value;
      return { key:key, value:value, shared: !!shared };
    },
    delete: async function(key, shared){
      if(storageOK){ try{ return await window.storage.delete(key, shared); }catch(e){ return null; } }
      var bucket = shared ? memoryStore.shared : memoryStore.personal;
      delete bucket[key];
      return { key:key, deleted:true, shared: !!shared };
    }
  };

  var state = {
    view: 'login', role: 'student', error: '', okMsg: '',
    currentUser: null, posts: [], subjects: [], saved: [],
    loading: true, openComments: {}, page: 'feed', feedSubjectFilter: null
  };

  function esc(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function initials(name){
    if(!name) return '?';
    var parts = name.trim().split(/\s+/);
    return (parts[0][0]||'').toUpperCase();
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function timeAgo(ts){
    var now = new Date(), d = new Date(ts);
    var diffSec = Math.floor((now-d)/1000);
    if(diffSec < 60) return 'เมื่อสักครู่';
    if(diffSec < 3600) return Math.floor(diffSec/60)+' นาทีที่แล้ว';
    var sameDay = now.toDateString() === d.toDateString();
    var hhmm = pad2(d.getHours())+':'+pad2(d.getMinutes());
    if(sameDay) return 'วันนี้ '+hhmm;
    var yest = new Date(now); yest.setDate(now.getDate()-1);
    if(yest.toDateString() === d.toDateString()) return 'เมื่อวาน '+hhmm;
    var diffDay = Math.floor(diffSec/86400);
    if(diffDay < 7) return diffDay+' วันที่แล้ว';
    return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'});
  }
  function randomCode(){
    var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    var out = '';
    for(var i=0;i<5;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function simpleHash(str){
    var h = 0;
    for(var i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h|=0; }
    return 'h'+h+'_'+str.length;
  }

  /* ---------- data access ---------- */
  async function getUser(email){
    var r = await storage.get('user:'+email, true);
    try{ return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
  }
  async function saveUser(u){ await storage.set('user:'+u.email, JSON.stringify(u), true); }
  async function loadPosts(){
    var r = await storage.get('posts-list', true);
    try{ return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
  }
  async function savePosts(list){ await storage.set('posts-list', JSON.stringify(list), true); }
  async function loadSubjects(){
    var r = await storage.get('subjects-list', true);
    try{ return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
  }
  async function saveSubjects(list){ await storage.set('subjects-list', JSON.stringify(list), true); }
  async function loadSaved(email){
    var r = await storage.get('saved:'+email, false);
    try{ return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
  }
  async function saveSaved(email, list){ await storage.set('saved:'+email, JSON.stringify(list), false); }
  async function getSession(){ var r = await storage.get('session', false); return r ? r.value : null; }
  async function setSession(email){ await storage.set('session', email, false); }
  async function clearSession(){ await storage.delete('session', false); }

  function mySubjects(){
    var u = state.currentUser;
    if(!u) return [];
    if(u.role === 'teacher') return state.subjects.filter(function(s){ return s.teacherEmail === u.email; });
    return state.subjects.filter(function(s){ return (s.members||[]).indexOf(u.email) !== -1; });
  }

  async function createSubject(name){
    var u = state.currentUser;
    var latest = await loadSubjects();
    var newSubject = {
      id: 's'+Date.now()+'_'+Math.floor(Math.random()*10000), name: name, code: randomCode(),
      teacherEmail: u.email, teacherName: u.name, members: [u.email], createdAt: Date.now()
    };
    latest.push(newSubject);
    await saveSubjects(latest);
    state.subjects = latest;
    return newSubject;
  }

  async function init(){
    var email = await getSession();
    if(email){
      var u = await getUser(email);
      if(u){
        state.currentUser = u;
        state.view = 'app';
        state.posts = await loadPosts();
        state.subjects = await loadSubjects();
        state.saved = await loadSaved(u.email);
      }
    }
    state.loading = false;
    render();
  }

  /* ---------------- RENDER ---------------- */
  function render(){
    var app = document.getElementById('app');
    var html = '';
    if(!storageOK){
  
    }

  function renderComments(p){
    var comments = p.comments || [];
    var list = comments.map(function(c){
      return '<div class="comment-item"><div class="avatar">'+esc(initials(c.authorName))+'</div>' +
        '<div class="c-body"><span class="c-name">'+esc(c.authorName)+'</span>'+esc(c.content)+'</div></div>';
    }).join('');

      '<form class="comment-form" data-comment-form="'+p.id+'">' +

  /* ---------------- EVENTS ---------------- */
  function bindAuthEvents(){
    document.querySelectorAll('[data-tab]').forEach(function(el){
      el.addEventListener('click', function(){ state.view = el.getAttribute('data-tab'); state.error = ''; render(); });
    });
    document.querySelectorAll('.role-opt').forEach(function(el){
      el.addEventListener('click', function(){ state.role = el.getAttribute('data-role'); render(); });
    });
    var loginForm = document.getElementById('loginForm');
    if(loginForm){
      loginForm.addEventListener('submit', async function(e){
        e.preventDefault();
        var email = document.getElementById('loginEmail').value.trim().toLowerCase();
        var pw = document.getElementById('loginPassword').value;
        var sid = document.getElementById('loginStudentId').value.trim();
        if(!/^\d{10}$/.test(sid)){ state.error = 'รหัสนักศึกษาต้องเป็นตัวเลข 10 หลัก'; render(); return; }
        var btn = loginForm.querySelector('button');
        btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ…';
        var u = await getUser(email);
        if(!u || u.password !== simpleHash(pw)){ state.error = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'; render(); return; }
        if(u.studentId !== sid){ state.error = 'รหัสนักศึกษาไม่ตรงกับข้อมูลที่ลงทะเบียนไว้'; render(); return; }
        await setSession(email);
        state.currentUser = u; state.view = 'app'; state.page = 'feed'; state.error = ''; state.loading = true;
        render();
        state.posts = await loadPosts(); state.subjects = await loadSubjects(); state.saved = await loadSaved(u.email);
        state.loading = false; render();
      });
    }
    var regForm = document.getElementById('registerForm');
    if(regForm){
      regForm.addEventListener('submit', async function(e){
        e.preventDefault();
        var name = document.getElementById('regName').value.trim();
        var email = document.getElementById('regEmail').value.trim().toLowerCase();
        var pw = document.getElementById('regPassword').value;
        var sid = document.getElementById('regStudentId').value.trim();
        if(!/^\d{10}$/.test(sid)){ state.error = 'รหัสนักศึกษาต้องเป็นตัวเลข 10 หลัก'; render(); return; }
        var btn = regForm.querySelector('button');
        btn.disabled = true; btn.textContent = 'กำลังสมัคร…';
        var existing = await getUser(email);
        if(existing){ state.error = 'อีเมลนี้มีผู้ใช้งานแล้ว ลองเข้าสู่ระบบแทน'; render(); return; }
        var newUser = { name: name, email: email, password: simpleHash(pw), role: state.role, studentId: sid, joined: Date.now() };
        await saveUser(newUser);
        await setSession(email);
        state.currentUser = newUser; state.view = 'app'; state.page = 'feed'; state.error = ''; state.loading = true;
        render();
        state.posts = await loadPosts(); state.subjects = await loadSubjects(); state.saved = await loadSaved(newUser.email);
        state.loading = false; render();
      });
    }
  }

  function bindAppEvents(){
    document.getElementById('logoutBtn').addEventListener('click', async function(){
      await clearSession();
      state.currentUser = null; state.posts = []; state.subjects = []; state.saved = [];
      state.view = 'login'; state.page = 'feed'; state.feedSubjectFilter = null; state.error = ''; state.okMsg = '';
      render();
    });

    document.querySelectorAll('[data-page]').forEach(function(el){
      el.addEventListener('click', function(){
        state.page = el.getAttribute('data-page'); state.error = ''; state.okMsg = ''; render();
      });
    });

    var clearFilterBtn = document.getElementById('clearFilterBtn');
    if(clearFilterBtn){ clearFilterBtn.addEventListener('click', function(){ state.feedSubjectFilter = null; render(); }); }

    var subjSel = document.getElementById('postSubject');
    if(subjSel){
      subjSel.addEventListener('change', async function(){
        if(subjSel.value === '__new__'){
          var name = window.prompt('ชื่อวิชาใหม่:');
          if(name && name.trim()){
            var created = await createSubject(name.trim());
            state.okMsg = 'สร้างวิชา "'+created.name+'" แล้ว รหัสวิชาคือ '+created.code;
            render();
            var reselect = document.getElementById('postSubject');
            if(reselect) reselect.value = created.id;
          } else {
            subjSel.value = '';
          }
        }
      });
    }

    var postBtn = document.getElementById('postBtn');
    if(postBtn){
      postBtn.addEventListener('click', async function(){
        var ta = document.getElementById('postText');
        var text = ta.value.trim();
        if(!text) return;
        var sel = document.getElementById('postSubject');
        var subjectId = (sel && sel.value && sel.value !== '__new__') ? sel.value : null;
        var urgentBox = document.getElementById('postUrgent');
        var urgent = urgentBox ? urgentBox.checked : false;
        postBtn.disabled = true; postBtn.textContent = 'กำลังโพสต์…';
        var u = state.currentUser;
        var newPost = {
          id: 'p'+Date.now()+'_'+Math.floor(Math.random()*10000),
          authorEmail: u.email, authorName: u.name, role: u.role, content: text,
          timestamp: Date.now(), comments: [], subjectId: subjectId, urgent: urgent
        };
        var latest = await loadPosts();
        latest.unshift(newPost);
        await savePosts(latest);
        state.posts = latest;
        render();
      });
    }

    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-toggle');
        state.openComments[id] = !state.openComments[id];
        render();
      });
    });

    document.querySelectorAll('[data-save]').forEach(function(el){
      el.addEventListener('click', async function(){
        var id = el.getAttribute('data-save');
        var u = state.currentUser;
        var list = state.saved || [];
        var idx = list.indexOf(id);
        if(idx === -1) list.push(id); else list.splice(idx,1);
        state.saved = list;
        await saveSaved(u.email, list);
        render();
      });
    });

    document.querySelectorAll('[data-comment-form]').forEach(function(form){
      form.addEventListener('submit', async function(e){
        e.preventDefault();
        var id = form.getAttribute('data-comment-form');
        var input = form.querySelector('[data-comment-input]');
        var text = input.value.trim();
        if(!text) return;
        var u = state.currentUser;
        var latest = await loadPosts();
        var post = latest.find(function(p){ return p.id === id; });
        if(post){
          post.comments = post.comments || [];
          post.comments.push({ authorName: u.name, role: u.role, content: text, timestamp: Date.now() });
          await savePosts(latest);
          state.posts = latest;
          state.openComments[id] = true;
          render();
        }
      });
    });

    var createSubjectForm = document.getElementById('createSubjectForm');
    if(createSubjectForm){
      createSubjectForm.addEventListener('submit', async function(e){
        e.preventDefault();
        var nameInput = document.getElementById('newSubjectName');
        var name = nameInput.value.trim();
        if(!name) return;
        var created = await createSubject(name);
        state.error = ''; state.okMsg = 'สร้างวิชา "'+name+'" แล้ว รหัสวิชาคือ '+created.code;
        render();
      });
    }

    var joinSubjectForm = document.getElementById('joinSubjectForm');
    if(joinSubjectForm){
      joinSubjectForm.addEventListener('submit', async function(e){
        e.preventDefault();
        var codeInput = document.getElementById('joinCode');
        var code = codeInput.value.trim().toUpperCase();
        if(!code) return;
        var u = state.currentUser;
        var latest = await loadSubjects();
        var subject = latest.find(function(s){ return s.code === code; });
        if(!subject){ state.error = 'ไม่พบวิชาที่ใช้รหัสนี้ ตรวจสอบรหัสอีกครั้ง'; state.okMsg = ''; render(); return; }
        subject.members = subject.members || [];
        if(subject.members.indexOf(u.email) === -1) subject.members.push(u.email);
        await saveSubjects(latest);
        state.subjects = latest;
        state.error = ''; state.okMsg = 'เข้าร่วมวิชา "'+subject.name+'" สำเร็จ';
        render();
      });
    }

    document.querySelectorAll('[data-view-subject]').forEach(function(el){
      el.addEventListener('click', function(){
        state.feedSubjectFilter = el.getAttribute('data-view-subject');
        state.page = 'feed';
        render();
      });
    });
  }

  init();
})();
</script>
</body>
</html>
